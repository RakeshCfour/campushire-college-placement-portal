<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | CampusHire</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Campus<span>Hire</span></a><a href="index.html" class="text-decoration-none text-dark">← Home</a></div></nav>
<div class="auth-wrap"><div class="auth-card">
<div class="mini-label">STUDENT PORTAL</div><h2 class="mt-2">Welcome back.</h2><p class="text-secondary">Login to continue to your placement dashboard.</p>
<form id="loginForm" novalidate>
<label class="form-label mt-3">Email</label><input id="email" class="form-control form-control-lg" type="email" placeholder="you@college.edu" required>
<label class="form-label mt-3">Password</label><input id="password" class="form-control form-control-lg" type="password" placeholder="••••••••" minlength="4" required>
<div id="loginMsg" class="mt-3"></div><button class="btn btn-dark btn-lg w-100 mt-2">Login</button>
</form><p class="text-center mt-4 mb-0">New student? <a href="register.html">Create account</a></p>
</div></div>
<script src="js/app.js"></script></body></html>
