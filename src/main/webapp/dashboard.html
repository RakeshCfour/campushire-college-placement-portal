<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | CampusHire</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar navbar-expand-lg bg-white sticky-top border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Campus<span>Hire</span></a><div class="d-flex gap-3"><a href="jobs.html" class="nav-link">Drives</a><button onclick="logout()" class="btn btn-outline-dark">Logout</button></div></div></nav>
<section class="page-head"><div class="container"><span class="mini-label">STUDENT DASHBOARD</span><h1 id="welcome">Welcome.</h1><p>Manage your profile and track placement applications.</p></div></section>
<section class="pb-5"><div class="container">
<div class="row g-4"><div class="col-lg-4"><div class="profile-card"><div class="avatar" id="avatar">S</div><h3 id="dashName">Student</h3><p id="dashEmail" class="text-secondary"></p><div class="profile-line"><span>Branch</span><b id="dashBranch">CSE</b></div><div class="profile-line"><span>CGPA</span><b id="dashCgpa">8.20</b></div></div></div>
<div class="col-lg-8"><div class="row g-3"><div class="col-sm-4"><div class="stat-card"><small>Applications</small><b id="appCount">0</b></div></div><div class="col-sm-4"><div class="stat-card"><small>Shortlisted</small><b id="shortCount">0</b></div></div><div class="col-sm-4"><div class="stat-card"><small>Available Drives</small><b id="driveCount">0</b></div></div></div>
<div class="card-box mt-4"><div class="d-flex justify-content-between align-items-center"><div><span class="mini-label">APPLICATIONS</span><h4 class="mt-2">Recent applications</h4></div><a href="jobs.html" class="btn btn-dark">Find Drives</a></div><div id="applications" class="mt-3"></div></div></div></div>
</div></section>
<script src="js/app.js"></script><script>renderDashboard()</script></body></html>
