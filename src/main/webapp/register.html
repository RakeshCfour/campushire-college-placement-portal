<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | CampusHire</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Campus<span>Hire</span></a><a href="index.html" class="text-decoration-none text-dark">← Home</a></div></nav>
<div class="auth-wrap"><div class="auth-card wide">
<div class="mini-label">CREATE ACCOUNT</div><h2 class="mt-2">Start your placement journey.</h2><p class="text-secondary">Enter your details to create a student profile.</p>
<form id="registerForm" novalidate>
<div class="row"><div class="col-md-6"><label class="form-label mt-3">Full Name</label><input id="name" class="form-control form-control-lg" required></div>
<div class="col-md-6"><label class="form-label mt-3">Email</label><input id="regEmail" class="form-control form-control-lg" type="email" required></div>
<div class="col-md-6"><label class="form-label mt-3">Branch</label><select id="branch" class="form-select form-select-lg"><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option></select></div>
<div class="col-md-6"><label class="form-label mt-3">CGPA</label><input id="cgpa" class="form-control form-control-lg" type="number" min="0" max="10" step=".01" required></div>
<div class="col-12"><label class="form-label mt-3">Password</label><input id="regPassword" class="form-control form-control-lg" type="password" minlength="4" required></div></div>
<div id="regMsg" class="mt-3"></div><button class="btn btn-dark btn-lg w-100 mt-2">Create Account</button>
</form><p class="text-center mt-4 mb-0">Already registered? <a href="login.html">Login</a></p>
</div></div>
<script src="js/app.js"></script></body></html>
